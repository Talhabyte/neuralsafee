name: neuralsafe
description: "NeuralSafe - Stealth safety application (calculator disguise)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6


  # Phase 2: local encrypted storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Phase 3: behavioral data collection
  permission_handler: ^11.3.1
  geolocator: ^12.0.0

  # Phase 4/5: on-device AI inference
  tflite_flutter: ^0.12.1
  dart_sentencepiece_tokenizer: ^1.3.1

  # Phase 6: on-device voice/audio inference
  record: ^6.2.1
  fftea: ^1.5.0

  # Phase 7: alerts
  # telephony: ^0.2.0   # SMS sending (Android only - added in Phase 7)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ml/neuralsafe_text_model.tflite
    - assets/ml/sentencepiece.bpe.model
    - assets/ml/neuralsafe_voice_model_v2.tflite
    - assets/ml/neuralsafe_voice_model_v3.tflite
    - assets/ml/mel_filterbank.bin
    - assets/ml/expected_log_mel.bin
    - assets/ml/test_audio_window.bin
    # Phase 8: Behavioral module's Random Forest + linear SVM ensemble
    # (BehavioralClassifier), trained by
    # tools/behavioral_model/generate_and_train.py
    - assets/ml/behavioral_classifier_model.json
